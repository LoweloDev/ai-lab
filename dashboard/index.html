<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script>
/* Theme so früh wie möglich setzen (kein Flackern). ?theme= überstimmt localStorage. */
(function(){
  var t = new URLSearchParams(location.search).get('theme');
  try { t = t || localStorage.getItem('ailab-theme'); } catch(e){}
  if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
})();
</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Navigation">
    <div class="brand"><span aria-hidden="true">🧪</span> AI-Lab</div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <button class="navbtn" data-nav="einstellungen" id="nav-settings">⚙ Einstellungen</button>
      <div class="refresh" title="Daten der aktiven Ansicht werden alle 10 s neu geladen">⟳ alle 10 s</div>
    </div>
  </aside>
  <div class="content">
    <div class="sysbar" id="sysbar" aria-live="polite"></div>
    <main id="view"><div class="loading">Lade …</div></main>
  </div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
